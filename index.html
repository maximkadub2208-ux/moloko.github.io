<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Виртуальный молочный цех — настольный прототип</title>
<style>
:root{--bg:#eef1f0;--panel:#fff;--ink:#1c2a2e;--mute:#5d6e72;--line:#d3dcdb;--ok:#2f8f5b;--wait:#c58a1b;--warn:#c8402f;--acc:#17606b}
@media (prefers-color-scheme:dark){:root{--bg:#141b1d;--panel:#1d272a;--ink:#e6eeee;--mute:#92a5a9;--line:#2f3d41;--ok:#4cc486;--wait:#e2a93a;--warn:#ef6a58;--acc:#5fc0cf}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;overflow:hidden}
header{grid-column:1/3;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:16px;margin:0}header span{color:var(--mute);font-size:12px}
#view{position:relative;min-height:0;overflow:hidden}#view canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--mute)}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px}
aside h2{font-size:15px;margin:0 0 8px}aside h3{font-size:13px;margin:16px 0 6px}
.badge{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;color:#fff}
.running{background:var(--ok)}.waiting{background:var(--wait)}.warning{background:var(--warn)}
table{width:100%;border-collapse:collapse}td{padding:3px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.msg{margin:8px 0;padding:8px 10px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.rec{margin:8px 0;padding:8px 10px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
footer{grid-column:1/3;border-top:1px solid var(--line);background:var(--panel);padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=range]{flex:1;min-width:140px}
.bars{display:flex;gap:2px;align-items:flex-end;height:34px}.bars i{flex:1;background:var(--acc);min-height:1px;opacity:.85}
.small{font-size:12px;color:var(--mute)}
.tabs{display:flex;gap:4px;margin:-4px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:6px 6px 0 0;background:none;padding:6px 10px}.tabs button.on{background:var(--acc);color:#fff}
[hidden]{display:none!important}
.sl{display:block;margin:9px 0}.sl output{float:right;font-variant-numeric:tabular-nums;color:var(--acc);font-weight:600}.sl input{width:100%}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:6px}.kpi div{border:1px solid var(--line);border-radius:8px;padding:6px 8px}.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
canvas.ch{width:100%;height:130px;display:block;border:1px solid var(--line);border-radius:6px;cursor:crosshair}
.pre button{margin:2px 4px 2px 0}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 6px;border-radius:6px;cursor:pointer}.row:hover,.row.on{background:var(--bg)}
.hbar{height:8px;background:var(--acc);border-radius:4px;margin:2px 0 6px}.hbar.w{background:var(--warn)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-right:6px}
footer{position:relative;z-index:5;gap:8px 12px}
.tabs{flex-wrap:wrap}.tabs button{padding:6px 7px;font-size:13px}
details{border-bottom:1px solid var(--line);padding:7px 0}summary{cursor:pointer;font-weight:600}details p{margin:6px 0 4px}
#tip{position:absolute;z-index:3;display:none;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;max-width:240px}
input[type=radio]{margin-right:6px}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 50vh auto auto;height:auto;overflow:auto}header,footer{grid-column:1}aside{border-left:0}}
</style>
</head>
<body>
<header><h1>Виртуальный молочный цех</h1><span>Настольный прототип виртуальной среды (3D на экране, без VR-шлема)</span>
<span id="src"></span><span id="upd"></span></header>
<div id="view"><div id="tip"></div><div id="hint">Вращение — перетащить · сдвиг — Shift или правая кнопка · масштаб — колесо · клик — выбор и фокус · двойной клик — сброс · 1–5 — выбор оборудования</div></div>
<aside><div class="tabs" role="tablist"><button data-t="panel" class="on">Оборудование</button><button data-t="what">Что если</button><button data-t="an">Аналитика</button><button data-t="mdl">Модели</button><button data-t="qa">Вопросы</button></div><section id="panel"></section><section id="what" hidden></section><section id="an" hidden></section><section id="mdl" hidden></section><section id="qa" hidden></section></aside>
<footer>
 <button id="play">Пауза</button>
 <input id="seek" type="range" min="0" value="0" aria-label="Время воспроизведения">

</footer>

function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function phys(m,fl,a,i){const v=fl/12;return m==='production'?{E:.8+v*(.0113+.0025+.0004*(a-18)+.00015*(i-4)),W:v*.05,out:v*.985}:m==='washing'?{E:3,W:150,out:0}:{E:.6,W:2,out:0};}
const pad=n=>String(n).padStart(2,'0'),fmtTs=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
function liveTick(){
 drift=.9*drift+.008*gauss();const pr=P.mode==='production',wsh=P.mode==='washing';
 const flow=pr?P.flow*(1+drift):0,amb=P.amb+.5*gauss(),inl=P.inlet+.3*gauss();
 const ph=phys(P.mode,flow,amb,inl),ex=phys(P.mode,pr?P.flow:0,P.amb,P.inlet);
 const E=ph.E*(1+P.noise/100*gauss())*(1+P.excess/100),W=ph.W*(1+P.noise/100*gauss()),resid=Math.abs(E-ex.E);
 run=resid>TH()?run+1:0;liveTs=new Date(liveTs.getTime()+300000);
 const f={ts:fmtTs(liveTs),mode:P.mode,flow,inlet:inl,temp:(pr?72:wsh?80:35)+.25*gauss(),pressure:pr?2+.0004*flow+.05*gauss():wsh?1.5:.3,load:pr?flow/55:wsh?10:3,
  E,W,out:ph.out,E_pred_now:ex.E,E_next:ex.E,W_next:ex.W,resid,alarm:run>=3};
 hist.push(f);if(hist.length>96)hist.shift();}
const TH=()=>live||!DATA.thresholds?DATA.threshold:(DATA.thresholds[MODEL]??DATA.threshold);
function vf(f){if(live||!f.preds||!f.preds[MODEL])return f;const p=f.preds[MODEL];return{...f,E_pred_now:p[0],E_next:p[1],alarm:p[2],resid:p[3]};}

function chart(cv,series,hl,marks){
 const d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;const g=cv.getContext('2d');g.scale(d,d);

 const all=series.flatMap(s=>s.y).concat(hl!=null?[hl]:[]);let lo=Math.min(0,...all),hi=Math.max(...all)*1.1||1;const n=series[0].y.length,X=i=>8+i*(w-16)/Math.max(1,n-1),Y=v=>h-16-(v-lo)/(hi-lo)*(h-24);
 g.strokeStyle=C('--line');g.fillStyle=C('--mute');g.font='10px sans-serif';
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);g.beginPath();g.moveTo(8,y);g.lineTo(w-8,y);g.stroke();g.fillText(v.toFixed(1),10,y-2);}
 if(hl!=null){g.strokeStyle=C('--warn');g.setLineDash([5,4]);g.beginPath();g.moveTo(8,Y(hl));g.lineTo(w-8,Y(hl));g.stroke();g.setLineDash([]);}
 series.forEach(s=>{g.strokeStyle=C(s.c);g.lineWidth=1.6;g.setLineDash(s.d?[4,3]:[]);g.beginPath();s.y.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();});g.setLineDash([]);
 g.fillStyle=C('--warn');(marks||[]).forEach(i=>{g.beginPath();g.arc(X(i),Y(series[0].y[i]),3.5,0,7);g.fill();});
 if(hv>=0&&hv<n){g.strokeStyle=C('--mute');g.beginPath();g.moveTo(X(hv),4);g.lineTo(X(hv),h-14);g.stroke();}}

 $('panel').innerHTML=`<h2>${name} <span class="badge ${st[sel]}">${STATE_RU[st[sel]]}</span></h2>
 <h3>Текущие параметры и фактическое потребление</h3><table>${params(sel,f).map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>
 <h3>Прогноз на следующий интервал (${live?'расчёт по заданным условиям':MODEL})</h3><table><tr><td>Электроэнергия</td><td>${f2(f.E_next)} кВт·ч</td></tr><tr><td>Вода</td><td>${f2(f.W_next,1)} л</td></tr></table>
 <h3>Отклонение</h3>${dev}<div class="rec"><b>Рекомендуемое действие.</b> ${recText(sel,st)}</div>
 <h3>Расписание: ${sched==='original'?'исходное':'рекомендуемое'} (сценарий «${scn}»)</h3>
 <table><tr class="small"><td>Выпуск, л</td><td>Энергия, кВт·ч</td><td>Вода, л</td><td>Затраты, тг</td><td>План</td></tr><tr>${col(cur)}</tr></table>
 <p class="small">Загрузка линии A по часам</p><div class="bars">${cur.load[0].map(v=>`<i style="height:${Math.max(2,v)}%" title="${f2(v,0)} %"></i>`).join('')}</div>
 <p class="small">Загрузка линии B по часам</p><div class="bars">${cur.load[1].map(v=>`<i style="height:${Math.max(2,v)}%" title="${f2(v,0)} %"></i>`).join('')}</div>
 ${S.plan_reduced?`<p class="small">Сырья не хватает для плана ${f2(S.plan_Q,0)} л: расчёт выполнен для допустимого объёма ${f2(S.Q_used,0)} л.</p>`:''}
 <p class="small">Затраты считаются по учебным тарифам; результат получен на симуляционных данных и не является доказанной экономией.</p>`;
 $('clock').textContent=f.ts+(live?' · живая симуляция':''); $('seek').value=idx; renderExtra();
}
function init(){if(!DATA.models.some(m=>m.name===MODEL))MODEL=DATA.model;buildMdl();buildQa();buildWhat();buildAn();
 $('src').textContent=DATA.source; $('upd').textContent='Данные обновлены: '+DATA.generated_at;
 $('seek').max=DATA.frames.length-1;
 $('scn').innerHTML=Object.keys(DATA.scenarios).map(k=>`<option>${k}</option>`).join(''); $('scn').value=scn; idx=Math.min(idx,DATA.frames.length-1); render();}
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Пауза':'Воспроизвести'};
$('seek').oninput=e=>{if(live)setLive(false);idx=+e.target.value;render()};
$('scn').onchange=e=>{scn=e.target.value;render()};
$('bo').onclick=()=>{sched='original';$('bo').classList.add('on');$('br').classList.remove('on');render()};
$('br').onclick=()=>{sched='recommended';$('br').classList.add('on');$('bo').classList.remove('on');render()};
async function reload(){try{const r=await fetch('workshop_data.json?'+Date.now());DATA=await r.json();init();}catch(e){$('upd').textContent+=' (JSON-файл недоступен по file://; запустите: python -m http.server)';}}
$('reload').onclick=reload;
let speed=700;$('spd').onchange=e=>speed=+e.target.value;
(function tick(){setTimeout(tick,speed);if(!playing||!DATA)return;if(live)liveTick();else idx=(idx+1)%DATA.frames.length;render();})();
$('auto').onclick=()=>window.setAuto&&setAuto();tabs();document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{const a=b.dataset.cam.split(',').map(Number);window.camTo&&camTo(...a);});
addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(e.target.tagName)&&e.key!==' ')return;if(e.key===' '){e.preventDefault();$('play').click();}
 else if(/^[1-5]$/.test(e.key)&&window.KEYS){sel=KEYS[+e.key-1];render();focus3d(sel);}
 else if(!live&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){idx=(idx+(e.key==='ArrowRight'?1:-1)+DATA.frames.length)%DATA.frames.length;render();}});
if(DATA)init();else reload();
</script>
</body>
</html>
